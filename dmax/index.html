<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dmax</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dmax">
<meta name="theme-color" content="#0d0c0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="color-scheme" content="dark">
<style>
:root{
  --bg:#0d0c0b;--panel:#181614;--panel2:#221f1c;--line:#34302b;--text:#f1ebe1;--muted:#a09789;
  --accent:#f0a030;--onacc:#1b1205;--pribg:#f0a030;--warn:#ff7a66;--ok:#9ad08a;--phbg:#221f1c;--bar:#f0a030;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
body.safe{--bg:#000;--panel:#000;--panel2:#000;--line:#3a0000;--text:#a40000;--muted:#6a0000;--accent:#c20000;--onacc:#c20000;--pribg:transparent;--warn:#c20000;--ok:#a40000;--phbg:#8a0000;--bar:transparent}
body.safe.dim1{--line:#280000;--text:#6c0000;--muted:#470000;--accent:#860000;--onacc:#860000;--warn:#860000;--ok:#6c0000;--phbg:#560000}
body.safe.dim3{--line:#4a0000;--text:#cf0000;--muted:#8a0000;--accent:#f00000;--onacc:#f00000;--warn:#f00000;--ok:#cf0000;--phbg:#b00000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em}
h2{font-size:26px;line-height:1.15}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-size:26px;font-style:italic;letter-spacing:.02em;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:760px;margin:0 auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 120px)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;min-height:66px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:relative}
#nav button.on{color:var(--accent)}
#nav button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--accent)}
#nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#navBadge{position:absolute;top:6px;right:8%;font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:9px;padding:0 5px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pribg);color:var(--onacc);border-color:var(--accent)}
body.safe .btn.pri{border-width:2px}
.btn.ghost{background:transparent}
.btn.big{min-height:84px;font-size:24px;border-radius:20px;width:100%;letter-spacing:.04em}
.btn.wide{width:100%}
.btn.sm{min-height:46px;padding:6px 14px;font-size:15px;border-radius:12px}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.card+.card,.card+.btn,.btn+.card{margin-top:12px}
.sec{margin-top:26px}
.sec>h3{margin-bottom:10px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.f{display:block;min-width:0}
.f>span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;min-height:54px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;outline:none;caret-color:var(--accent);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
textarea{min-height:96px;resize:vertical;line-height:1.35}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
input[type=file]{display:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.span2{grid-column:span 2}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:46px;padding:8px 16px;border-radius:23px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pribg);color:var(--onacc);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{flex:1;min-height:52px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;padding:6px 4px;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pribg);color:var(--onacc);box-shadow:inset 0 0 0 2px var(--accent)}
.tabs{margin:0 -14px 16px;padding:0 14px 6px}
.pill{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:20px;padding:2px 9px;white-space:nowrap}
.st-test{color:var(--muted)}.st-work{color:#7fb6d6}.st-final{color:var(--ok)}.st-edition{color:var(--accent)}.st-exhibited{color:#c9a0e8}.st-sold{color:#ff8fa0}
body.safe .pill{color:var(--text)}
.stars{color:var(--accent);letter-spacing:2px;font-size:15px;white-space:nowrap}
.pc{display:flex;gap:14px;width:100%;text-align:left;cursor:pointer;color:var(--text);padding:12px;align-items:stretch}
.pc+.pc{margin-top:10px}
.ph{display:block;background:var(--phbg);border-radius:10px;overflow:hidden;isolation:isolate;flex:none}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
body.safe .ph img{mix-blend-mode:multiply;filter:grayscale(1) brightness(.6) contrast(1.1)}
.th{width:84px;height:84px}
.noph{width:84px;height:84px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:26px;color:var(--muted);flex:none}
.pc-b{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pc-t{font-family:var(--serif);font-size:20px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-m{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-f{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:15;min-height:62px;padding:0 26px;border-radius:31px;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
body.safe .fab{background:#000;box-shadow:none}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;line-height:1;letter-spacing:-.02em}
.out{border:1px solid var(--accent);border-radius:18px;padding:16px;margin-top:14px}
.out .big{font-size:56px;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv b.txt{font-family:var(--sans);font-weight:500;white-space:pre-wrap}
.warn{border:1px dashed var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.note{font-size:14px;color:var(--muted);margin-top:10px}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
th{font:600 11px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px}
td{text-align:right;padding:10px 6px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr.hl td{color:var(--accent);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.tile i{display:block;font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-family:var(--mono);font-size:26px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.gal .gi{flex:none;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
.gal .ph{width:132px;height:132px;margin-bottom:4px}
.gread{text-align:center;padding:18px 8px 14px}
.gread .gname{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}
.gread .ym{display:flex;justify-content:center;gap:22px;margin-top:6px}
.gread .ym div{min-width:0}
.gread .ym i{display:block;font-style:normal;font-size:14px;letter-spacing:.2em;color:var(--muted)}
.gread .ym b{font-family:var(--mono);font-weight:700;font-size:clamp(72px,26vw,150px);line-height:.95;color:var(--accent);letter-spacing:-.04em}
.gbtn{min-height:60px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font-family:var(--mono);font-size:22px;font-weight:600;cursor:pointer}
.gbtn.on{background:var(--pribg);color:var(--onacc);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.tbig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(84px,30vw,170px);line-height:1;text-align:center;color:var(--accent);letter-spacing:-.04em;padding:8px 0}
.tstate{text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);min-height:20px}
.steps .stp{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:50px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
.steps .stp+.stp{margin-top:6px}
.steps .stp.on{color:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.steps .stp.done{opacity:.5;text-decoration:line-through}
.menu .btn{justify-content:space-between;width:100%;min-height:68px;font-size:19px;font-family:var(--serif);font-weight:600}
.menu .btn+.btn{margin-top:10px}
.menu .btn small{font:400 13px var(--sans);color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--bar);border:1px solid var(--accent);min-width:3px}
.barrow{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.barrow b{font-family:var(--mono);text-align:right}
.months{display:flex;align-items:flex-end;gap:4px;height:90px}
.months div{flex:1;border:1px solid var(--accent);background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
.mlab{display:flex;gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.mlab span{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:60;background:var(--bg);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:14px;font-size:16px;max-width:86vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#lb{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#lb[hidden]{display:none}
#lb .ph{display:inline-block;max-width:100%;border-radius:4px}
#lb .ph img{width:auto;height:auto;max-width:100%;max-height:68vh;object-fit:contain}
.xbtn{width:46px;min-width:46px;padding:0}
.hr{height:1px;background:var(--line);margin:16px 0}
.back{background:none;border:0;color:var(--muted);min-height:46px;padding:0 6px 0 0;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.rate button{background:none;border:0;font-size:34px;color:var(--muted);min-width:50px;min-height:54px;cursor:pointer;padding:0}
.rate button.on{color:var(--accent)}
.apg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apg div{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-family:var(--mono);font-size:15px}
.apg div.full{border-color:var(--muted)}
.apg div.cur{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.apg i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
@media(min-width:620px){.tiles{grid-template-columns:repeat(6,1fr)}.apg{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><b>Dmax</b><span id="crumb">Print log</span></div>
  <button id="safeBtn" class="btn sm ghost" data-a="safe" aria-pressed="false">Safelight</button>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-a="nav" data-v="log"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17H6zM9.5 8h5M9.5 12h5M9.5 16h3"/></svg>Log</button>
  <button data-a="nav" data-v="tools"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5l3 6M20.2 10l-6.6 1M17.5 18.5l-4-5.3M6.5 18.5l2.6-6M3.8 10l6.2 2.6"/></svg>Tools</button>
  <button data-a="nav" data-v="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9M9.5 3h5M18 7l1.5-1.5"/></svg>Timer<span id="navBadge" hidden></span></button>
  <button data-a="nav" data-v="grades"><svg viewBox="0 0 24 24"><path d="M3.5 6h17M6.5 12h11M9.5 18h5"/></svg>Grades</button>
  <button data-a="nav" data-v="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>More</button>
</nav>
<div id="toast"></div>
<div id="lb" hidden></div>
<a id="dl" hidden></a>
<input type="file" id="camIn" accept="image/*" capture="environment">
<input type="file" id="libIn" accept="image/*" multiple>
<input type="file" id="impIn" accept=".json,application/json">
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:NaN};
const has=v=>v!==''&&v!=null;
const MINUS='−', TIMES='×';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function fx(n,d){d=d==null?1:d;if(!isFinite(n))return '?';const s=Math.abs(n).toFixed(d);return (n<0&&+s!==0?MINUS:'')+s}
function trim(n,d){if(!isFinite(n))return '?';return fx(n,d==null?1:d).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1')}
function clock(s){s=Math.max(0,Math.ceil(s-1e-6));const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')}
function parseClock(v){v=String(v).trim();if(v.includes(':')){const [m,s]=v.split(':');return (num(m)||0)*60+(num(s)||0)}return num(v)}
function fT(s){if(!isFinite(s))return '?';return s>=100?fx(s,0)+'s ('+clock(s)+')':fx(s,1)+'s'}
function fS(st,d){d=d==null?2:d;if(!isFinite(st))return '?';const s=Math.abs(st).toFixed(d);return (+s===0?'':st>0?'+':MINUS)+s}
function frac12(k,sign){ /* k in twelfths of a stop */
  if(k===0)return '0';const sg=k>0?(sign===false?'':'+'):MINUS;k=Math.abs(k);const w=Math.floor(k/12),r=k%12;let f='';
  if(r){const g=gcd(r,12);f=(r/g)+'/'+(12/g)}return sg+[w||'',f].filter(Boolean).join(' ')}
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fDate(iso){if(!iso)return '';const p=iso.split('-');return p.length<3?iso:(+p[2])+' '+MON[p[1]-1]+' '+p[0]}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ================= storage ================= */
const DB={db:null,mem:{kv:new Map(),prints:new Map(),photos:new Map()},
  open(){return new Promise(res=>{try{const r=indexedDB.open('dmax_darkroom',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('prints',{keyPath:'id'});const p=d.createObjectStore('photos',{keyPath:'id'});p.createIndex('printId','printId')};
    r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  tx(store,mode,fn){return new Promise((res,rej)=>{try{const t=this.db.transaction(store,mode);const rq=fn(t.objectStore(store));let out;if(rq)rq.onsuccess=()=>{out=rq.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  get(s,k){return this.db?this.tx(s,'readonly',o=>o.get(k)):Promise.resolve(this.mem[s].get(k))},
  put(s,v,k){if(!this.db){this.mem[s].set(k!==undefined?k:v.id,v);return Promise.resolve()}return this.tx(s,'readwrite',o=>k!==undefined?o.put(v,k):o.put(v))},
  del(s,k){if(!this.db){this.mem[s].delete(k);return Promise.resolve()}return this.tx(s,'readwrite',o=>o.delete(k))},
  all(s){return this.db?this.tx(s,'readonly',o=>o.getAll()):Promise.resolve([...this.mem[s].values()])},
  clear(s){if(!this.db){this.mem[s].clear();return Promise.resolve()}return this.tx(s,'readwrite',o=>o.clear())},

function gradeInfo(i,mode){mode=mode||S.filterMode;const base=mode==='single'?SINGLE[i]:DUAL[i];
  let y=base[0],m=base[1],maxNote=false,f=mode==='dual'?DUALF[i]:null,fsrc=mode==='dual'?'start':'none',src='ilford';

/* ================= math ================= */
function mFromCol(col,f){const D=(col+(num(S.colOffset)||0))*colMM();if(!(D>=4*f))return NaN;return ((D-2*f)+Math.sqrt((D-2*f)*(D-2*f)-4*f*f))/(2*f)}
const negToPaper=(M,f)=>f*(M+1)*(M+1)/M;
function resizeMath(c){const f=num(c.lensF),nl=num(c.negLong),ns=num(c.negShort)||nl,t=num(c.t),u=uMM();
  let M1=c.src==='size'?num(c.long1)*u/nl:c.src==='v'?num(c.v1)/f-1:mFromCol(num(c.col1),f);
  const M2=num(c.long2)*u/nl;
  if(!(t>0&&f>0&&nl>0&&M1>0&&M2>0))return null;
  const t2=t*Math.pow((M2+1)/(M1+1),2);
  return {f,nl,ns,t,M1,M2,t2,stops:Math.log2(t2/t),long2:num(c.long2),short2:num(c.long2)*ns/nl,long1:M1*nl/u,v2:f*(M2+1),v1:f*(M1+1),col2:negToPaper(M2,f)/colMM()-(num(S.colOffset)||0)}}
function stripRows(c){const base=num(c.base),st=+c.step,n=clamp(parseInt(c.n)||0,2,15);if(!(base>0))return [];
  const start=c.mode==='center'?-Math.floor((n-1)/2):0;let prev=0;const rows=[];
  for(let i=0;i<n;i++){const k=(start+i)*st,total=base*Math.pow(2,k/12),r=Math.round(total*10)/10;rows.push({i:i+1,k,total,inc:Math.round((r-prev)*10)/10});prev=r}
  return rows}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res([im,u]);im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image'))};im.src=u})}
function scaleImg(im,max,q){const w=im.naturalWidth,h=im.naturalHeight,r=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function filesToPhotos(files,printId,kind){const out=[];for(const f of files){try{const [im,u]=await loadImg(f);out.push({id:uid(),printId,kind,data:scaleImg(im,1600,.82),thumb:scaleImg(im,360,.72),created:Date.now()});URL.revokeObjectURL(u)}catch(e){toast('Could not read that image')}}return out}
async function onPhotoFiles(inp){const files=[...inp.files];inp.value='';if(!files.length)return;const kind=($('#kindSel')||{}).value||'work';
  if(R.log.mode==='form'&&F){const ph=await filesToPhotos(files,F.p.id,kind);ph.forEach(x=>{x._new=true;F.photos.push(x)});const el=$('#fph');if(el)el.innerHTML=formPhotos()}
  else if(R.log.mode==='detail'){const p=byId(R.log.id);if(!p)return;const ph=await filesToPhotos(files,p.id,kind);for(const x of ph)await DB.put('photos',x);if(ph.length){p.cover=ph[ph.length-1].thumb;p.updated=Date.now();await DB.put('prints',p)}loadGallery();toast('Photo saved')}}
async function savePrint(){const p=F.p;if(!String(p.title).trim()&&!String(p.negRef).trim()){toast('Give it a title or a neg ref first');return}
  p.updated=Date.now();p.rating=p.rating|0;if(p.grade!=='')p.grade=+p.grade;
  try{for(const id of F.removed)await DB.del('photos',id);
    for(const x of F.photos)if(x._new){delete x._new;await DB.put('photos',x)}
    const rank={final:3,work:2,test:1};const best=[...F.photos].sort((a,b)=>(rank[b.kind]-rank[a.kind])||b.created-a.created)[0];p.cover=best?best.thumb:'';
    await DB.put('prints',p)}catch(e){toast('Save failed. Storage may be full.');return}
  const i=prints.findIndex(x=>x.id===p.id);if(i>=0)prints[i]=p;else prints.push(p);
  if(p.paper&&!S.papers.includes(p.paper)){S.papers.push(p.paper);save()}
  F=null;R.log={mode:'detail',id:p.id};render(true);toast('Saved. Nice one.')}

const T={enl:{state:'idle',at:0,last:null,queue:null,qi:0},proc:{idx:0,state:'idle',at:0,remain:0,warned:false},met:{on:false,n:0,iv:null},iv:null};
let AC=null,WL=null,wlOk=true;
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function beep(f,d,v,t){if(!S.timer.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(t||0);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.25,s+.006);g.gain.setValueAtTime(v||.25,s+d);g.gain.linearRampToValueAtTime(0,s+d+.03);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.06)}catch(e){}}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
async function wake(on){try{if(on){if(!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!navigator.wakeLock)wlOk=false}else if(WL){const w=WL;WL=null;await w.release()}}catch(e){WL=null;wlOk=false}}
const anyRun=()=>T.enl.state!=='idle'||T.proc.state==='run'||T.met.on;
function startLoop(){if(!T.iv)T.iv=setInterval(loop,50);wake(true)}
function stopLoopIfIdle(){if(!anyRun()){clearInterval(T.iv);T.iv=null;wake(false)}}
function enlStart(){const e=T.enl;audio();const secs=num(S.timer.secs);
  if(e.state!=='idle'){e.state='idle';paintTimer();stopLoopIfIdle();return}
  if(!(secs>0)){toast('Set a time first');return}
  const now=Date.now(),lead=+S.timer.lead||0;e.last=null;
  if(lead>0){e.state='lead';e.at=now+lead*1000}else{e.state='run';e.at=now+secs*1000;beep(1320,.1)}
  startLoop();paintTimer()}
function enlDone(){const e=T.enl;e.state='idle';beep(660,.45,.3);buzz([200,80,200]);
  if(e.queue){e.qi++;if(e.qi<e.queue.length){S.timer.secs=e.queue[e.qi]}else{toast('Strip done. Into the dev.');e.qi=0;S.timer.secs=e.queue[0]}}
  if(R.tab==='timer'&&R.timerTab!=='proc')render();stopLoopIfIdle()}
function procStart(){const p=T.proc;audio();if(!S.steps.length)return;
  if(p.state==='run'){p.remain=Math.max(0,(p.at-Date.now())/1000);p.state='pause'}
  else{if(p.state==='done'||p.idx>=S.steps.length){p.idx=0;p.state='idle'}
    if(p.state==='idle'){p.remain=S.steps[p.idx].secs;p.warned=false}
    p.at=Date.now()+p.remain*1000;p.state='run';beep(1320,.1);startLoop()}
  paintTimer();stopLoopIfIdle()}
function procNext(auto){const p=T.proc;if(p.idx<S.steps.length-1){p.idx++;p.warned=false;p.remain=S.steps[p.idx].secs;if(auto&&S.autoAdv){p.at=Date.now()+p.remain*1000;p.state='run'}else p.state='idle'}
  else{p.state='done';p.remain=0;if(auto){const act=S.chem.filter(c=>c.active);if(act.length){act.forEach(c=>{c.used=(+c.used||0)+1});save();toast('Print done. Counted against '+plural(act.length,'batch').replace('batchs','batches')+'.')}else toast('Print done. Go look at it in the light.')}}
  if(R.tab==='timer')render();stopLoopIfIdle()}
function loop(){const now=Date.now(),e=T.enl,p=T.proc;
  if(e.state==='lead'){const r=(e.at-now)/1000,c=Math.ceil(r);if(c!==e.last&&c>0){e.last=c;beep(440,.07)}if(r<=0){e.state='run';e.at=e.at+num(S.timer.secs)*1000;e.last=null;beep(1320,.1)}}
  else if(e.state==='run'){const r=(e.at-now)/1000;if(r<=0)enlDone();else if(S.timer.tick){const c=Math.ceil(r);if(e.last===null)e.last=c;else if(c!==e.last){e.last=c;beep(880,.03,.14)}}}
  if(p.state==='run'){const r=(p.at-now)/1000;if(!p.warned&&r<=10&&S.steps[p.idx].secs>12){p.warned=true;beep(520,.12);beep(520,.12,.25,.25)}

async function storageInfo(){let t=plural(prints.length,'print');try{const ph=await DB.all('photos');t+=', '+plural(ph.length,'photo');if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.usage)t+=', about '+fx(e.usage/1048576,1)+' MB used'}}catch(e){}const el=$('#stor');if(el)el.textContent=t}
function vAbout(){return `${backMore}<h2>Field notes</h2><div class="card stack" style="margin-top:14px">
  <p><b>Resize.</b> New time = old time ${TIMES} ((M2 + 1) / (M1 + 1))², where M is magnification. It gets you close. Paper does not respond in a perfectly straight line, so always confirm with a strip.</p>
  <p><b>Stops.</b> New time = time ${TIMES} 2 to the power of stops. Burn = base ${TIMES} (2^s ${MINUS} 1). Dodge = base ${TIMES} (1 ${MINUS} 2^${MINUS}s).</p>
  <p><b>Aperture.</b> New time = time ${TIMES} (N2 / N1)². <b>Paper speed.</b> New time = time ${TIMES} old ISO P / new ISO P.</p>
  <p><b>Grades.</b> Filtration is Ilford Contrast Control data for Multigrade papers, Kodak group. Dual filter factors of ${TIMES}1 up to grade 3½ and ${TIMES}2 from 4 to 5 are starting points only.</p>
  <p><b>Column.</b> The app treats column reading plus offset as the distance from negative to paper, using thin lens math. Calibrate the offset once in Kit.</p>
  <p><b>Safelight mode.</b> Red on black and dim, but a phone is still a light source. Keep it away from open paper, face it down when you can, and run a fog test before you trust it.</p>
  <p><b>Timers.</b> The app counts and beeps but cannot switch your enlarger. Sound needs one tap to wake up, which the start button handles.</p>
  <p class="muted small">Dmax is a single file. No account, no cloud, no tracking. Add it to your home screen and it behaves like an app.</p></div>`}

/* ================= export / import ================= */
function download(blob,name){const u=URL.createObjectURL(blob),a=$('#dl');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function exportJson(){const photos=await DB.all('photos');S.lastBackup=Date.now();save();
  download(new Blob([JSON.stringify({app:'dmax',version:1,exported:new Date().toISOString(),settings:S,prints,photos})],{type:'application/json'}),'dmax_backup_'+today().replace(/\D/g,'')+'.json');toast('Backup exported');if(R.more==='backup'&&R.tab==='more')render()}
const CSVCOLS=['title','negRef','film','date','status','paper','sizeA','sizeB','unit','imgLong','negFormat','lensF','aperture','column','lensToPaper','grade','y','m','baseTime','splitLow','splitHigh','dodgeBurn','dev','dilution','devTime','toner','wash','edNo','edSize','rating','notes','id'];
function exportCsv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[CSVCOLS.join(',')].concat(prints.map(p=>CSVCOLS.map(c=>q(c==='grade'?(has(p.grade)?GR[p.grade].replace('½',p.grade<1?'1/2':' 1/2'):''):c==='status'?stName(p.status):p[c])).join(',')));
  download(new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'}),'dmax_prints_'+today().replace(/\D/g,'')+'.csv');toast('CSV exported')}
async function importFile(file,mode){let d;try{d=JSON.parse(await file.text())}catch(e){toast('That file is not valid JSON');return}
  if(!d||d.app!=='dmax'||!Array.isArray(d.prints)){toast('That does not look like a Dmax backup');return}
  try{if(mode==='replace'){await DB.clear('prints');await DB.clear('photos');prints=[];if(d.settings){S=mergeDef(DEF(),d.settings)}}
    for(const p of d.prints){if(!p||!p.id)continue;await DB.put('prints',p);const i=prints.findIndex(x=>x.id===p.id);if(i>=0)prints[i]=p;else prints.push(p)}
    for(const x of (d.photos||[])){if(x&&x.id&&x.printId)await DB.put('photos',x)}
    await DB.put('kv',S,'settings')}catch(e){toast('Import hit a snag. Storage may be full.');return}
  applySafe();render();toast('Imported '+plural(d.prints.length,'print'))}

/* ================= actions ================= */
let armed=null;
function arm(el,fn){if(armed===el){armed=null;fn();return}if(armed&&armed.isConnected)armed.textContent=armed.dataset.lbl;armed=el;el.dataset.lbl=el.textContent;el.textContent='Sure? Tap again';setTimeout(()=>{if(armed===el){armed=null;if(el.isConnected)el.textContent=el.dataset.lbl}},3500)}
function copyText(t){const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(fb);else fb()}catch(e){fb()}toast('Copied')}
const A={
  nav(el){if(el.dataset.v==='more')R.more='menu';if(el.dataset.v==='log'&&R.tab==='log'&&R.log.mode==='detail')R.log.mode='list';go(el.dataset.v)},
  safe(){S.safe=!S.safe;save();applySafe()},
  filter(el){R.filter=el.dataset.v;render()},
  newPrint(){openForm(blank(),true)},
  openPrint(el){R.tab='log';R.log={mode:'detail',id:el.dataset.id};render(true)},
  back(){R.log.mode='list';render(true)},
  async editPrint(){const p=byId(R.log.id);openForm(p,false,await DB.byPrint(p.id))},
  cancelForm(){const was=F;F=null;R.log.mode=was&&!was.isNew&&byId(was.p.id)?'detail':'list';render(true)},
  savePrint(){savePrint()},
  delPrint(el){arm(el,async()=>{const id=R.log.id;for(const x of await DB.byPrint(id))await DB.del('photos',x.id);await DB.del('prints',id);prints=prints.filter(p=>p.id!==id);R.log.mode='list';render(true);toast('Deleted')})},
  dupPrint(){openForm(dupOf(byId(R.log.id)),true);toast('Copied the recipe. Tweak and save.')},
  nextEd(el){const src=byId(el.dataset.id||R.log.id);if(!src)return;const sibs=prints.filter(p=>has(p.edNo)&&(p.title||'')===(src.title||'')&&(p.negRef||'')===(src.negRef||''));
    const next=Math.max(0,...sibs.map(p=>num(p.edNo)||0))+1;openForm(dupOf(src,{edNo:String(next),status:'edition'}),true)},
  scalePrint(){const p=byId(R.log.id),c=S.calc.resize,conv=v=>num(v)*uMM(p.unit)/uMM();c.fromPrint=p.id;
    if(FORMATS[p.negFormat]){c.fmt=p.negFormat;c.negLong=String(FORMATS[p.negFormat][0]);c.negShort=String(FORMATS[p.negFormat][1])}
    if(has(p.lensF))c.lensF=String(p.lensF);if(has(p.baseTime))c.t=String(p.baseTime);if(has(p.aperture)&&isFinite(apIdx(p.aperture)))c.N=apName(apIdx(p.aperture));
    if(has(p.imgLong)){c.src='size';c.long1=trim(conv(p.imgLong),2)}else if(has(p.lensToPaper)){c.src='v';c.v1=String(p.lensToPaper)}else if(has(p.column)){c.src='col';c.col1=String(p.column)}
    else if(has(p.sizeA)&&has(p.sizeB)){c.src='size';c.long1=trim(conv(Math.max(num(p.sizeA),num(p.sizeB))),2)}
    S.calc.tool='resize';save();go('tools')},
  logReprint(){const c=S.calc.resize,r=resizeMath(c),p=byId(c.fromPrint);if(!r||!p)return;const sc=r.t2/r.t,rd=x=>String(Math.round(x*10)/10);
    openForm(dupOf(p,{baseTime:rd(r.t2),splitLow:has(p.splitLow)?rd(num(p.splitLow)*sc):'',splitHigh:has(p.splitHigh)?rd(num(p.splitHigh)*sc):'',sizeA:'',sizeB:'',unit:S.unit,imgLong:trim(r.long2,2),lensToPaper:String(Math.round(r.v2)),column:rd(r.col2),status:'test',
      notes:'Scaled from '+trim(r.long1,1)+' to '+trim(r.long2,1)+' '+S.unit+' ('+fS(r.stops)+' stops). Dodge and burn times '+TIMES+fx(sc,2)+'. Confirm with a strip.'+(p.notes?'\n'+p.notes:'')}),true)},
  planPrint(){const p=byId(R.log.id),c=S.calc.db;c.printId=p.id;if(has(p.baseTime))c.T=String(p.baseTime);S.calc.tool='db';save();go('tools')},
  timePrint(){const p=byId(R.log.id);sendTimer(num(p.baseTime))},
  rate(el){const v=+el.dataset.v;F.p.rating=F.p.rating===v?0:v;$$('.rate button').forEach(b=>b.classList.toggle('on',+b.dataset.v<=F.p.rating))},
  sizeChip(el){const [a,b]=el.dataset.v.split(',');F.p.sizeA=a;F.p.sizeB=b;$('[data-f=sizeA]').value=a;$('[data-f=sizeB]').value=b},
  formLens(el){F.p.lensF=el.dataset.v;$('[data-f=lensF]').value=el.dataset.v},
  pickPhoto(el){$(el.dataset.src==='cam'?'#camIn':'#libIn').click()},
  rmFormPhoto(el){const id=el.dataset.id,x=F.photos.find(p=>p.id===id);if(x&&!x._new)F.removed.push(id);F.photos=F.photos.filter(p=>p.id!==id);$('#fph').innerHTML=formPhotos()},
  async viewPhoto(el){const x=await DB.get('photos',el.dataset.id);if(!x)return;const lb=$('#lb');lb.innerHTML=`<span class="ph"><img alt="" src="${x.data}"></span><p class="eyebrow">${kindName(x.kind)} · ${fDate(new Date(x.created-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10))}</p><div class="row"><button class="btn" data-a="closeLb">Close</button><button class="btn danger" data-a="delPhoto" data-id="${x.id}">Delete photo</button></div>`;lb.hidden=false},
  closeLb(){$('#lb').hidden=true;$('#lb').innerHTML=''},
  delPhoto(el){arm(el,async()=>{await DB.del('photos',el.dataset.id);const p=byId(R.log.id);if(p){const rest=await DB.byPrint(p.id);p.cover=rest.length?rest[rest.length-1].thumb:'';await DB.put('prints',p)}A.closeLb();loadGallery()})},
  tool(el){S.calc.tool=el.dataset.v;save();render(true)},
  setk(el){const v=el.dataset.v;setPath(S.calc,el.dataset.k,/^(strip\.step)$/.test(el.dataset.k)?+v:v);save();render()},
  stepk(el){const k=+el.dataset.v,c=S.calc.stops;c.k=k===0?0:clamp(c.k+k,-72,72);save();TOOLS.stops.out()},
  sendStrip(){const rows=stripRows(S.calc.strip);if(!rows.length)return;T.enl.queue=rows.map(r=>r.inc);T.enl.qi=0;T.enl.state='idle';S.timer.secs=rows[0].inc;save();R.timerTab='enl';go('timer');toast('Strip loaded. Tap Expose for each burst.')},
  sendT(el){sendTimer(num(el.dataset.s))},
  addRow(){S.calc.db.rows.push({name:'',type:'burn',k:4});save();render()},
  rmRow(el){S.calc.db.rows.splice(+el.dataset.v,1);save();render()},
  copyPlan(){copyText(TOOLS.db.text())},
  async savePlan(){const p=byId(S.calc.db.printId);if(!p)return;p.dodgeBurn=(p.dodgeBurn?p.dodgeBurn+'\n':'')+TOOLS.db.lines().map(l=>l.txt).join('\n');p.updated=Date.now();await DB.put('prints',p);toast('Plan saved to the print')},
  grade(el){S.sel=+el.dataset.v;save();render()},
  tog(el){setPath(S,el.dataset.p,!getPath(S,el.dataset.p));save();render();if(R.tab==='timer')audio()},
  setS(el){setPath(S,el.dataset.p,el.dataset.n?+el.dataset.v:el.dataset.v);save();applySafe();render()},
  calReset(el){arm(el,()=>{S.calib.g={};save();render();toast('Back to stock Ilford numbers')})},
  more(el){R.tab='more';R.more=el.dataset.v;render(true)},
  addLens(){S.lenses.push({id:uid(),name:'',f:''});save();render()},
  addPaper(){S.papers.push('');save();render()},
  addChem(){S.chem.push({id:uid(),name:'',mixed:today(),capacity:'',used:0,life:'',active:true});save();render()},
  addStep(){S.steps.push({name:'New step',secs:60});save();render()},
  rmItem(el){getPath(S,el.dataset.p).splice(+el.dataset.v,1);if(el.dataset.p==='steps'){T.proc.idx=0;T.proc.state='idle'}save();render()},
  chemPlus(el){const c=S.chem[+el.dataset.v];c.used=(+c.used||0)+1;save();render()},
  chemMinus(el){const c=S.chem[+el.dataset.v];c.used=Math.max(0,(+c.used||0)-1);save();render()},
  chemAct(el){const c=S.chem[+el.dataset.v];c.active=!c.active;save();render()},
  calCol(){const rd=num($('#ccR').value),L=num($('#ccL').value)*uMM(),n=num($('#ccN').value),f=num($('#ccF').value);if(!(isFinite(rd)&&L>0&&n>0&&f>0)){toast('Fill in all four boxes');return}
    const M=L/n;S.colOffset=Math.round((negToPaper(M,f)/colMM()-rd)*10)/10;save();render();toast('Offset set to '+fx(S.colOffset,1)+' '+S.colUnit)},
  exportJson(){exportJson()},exportCsv(){exportCsv()},
  importPick(el){const m=el.dataset.v;if(m==='replace')arm(el,()=>{R.imp=m;$('#impIn').click()});else{R.imp=m;$('#impIn').click()}},
  async persist(){let ok=false;try{ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false}catch(e){}toast(ok?'Done. The browser will hang on to it.':'The browser said not right now. Keep exporting backups.')},
  ttab(el){R.timerTab=el.dataset.v;render()},
  enlStart(){enlStart()},
  enlAdj(el){if(T.enl.state!=='idle')return;S.timer.secs=Math.max(.1,Math.round(((num(S.timer.secs)||0)+ +el.dataset.v)*10)/10);save();const i=$('#eSecs');if(i)i.value=S.timer.secs;paintTimer()},
  clearQ(){T.enl.queue=null;T.enl.qi=0;render()},
  qJump(el){if(T.enl.state!=='idle')return;T.enl.qi=+el.dataset.v;S.timer.secs=T.enl.queue[T.enl.qi];render()},
  met(){metToggle()},
  pStart(){procStart()},
  pNext(){procNext(false)},
  pReset(){T.proc.idx=0;T.proc.state='idle';render();stopLoopIfIdle()},
  pJump(el){T.proc.idx=+el.dataset.v;T.proc.state='idle';render();stopLoopIfIdle()}
};
function sendTimer(s){if(!(s>0))return;T.enl.queue=null;T.enl.qi=0;if(T.enl.state!=='idle')T.enl.state='idle';S.timer.secs=Math.round(s*10)/10;save();R.timerTab='enl';go('timer');toast(fx(S.timer.secs,1)+'s loaded')}

/* ================= events ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el,e)}});
/* rerender after a field commit, delayed so a tap that caused the blur still lands */
function later(){const tab=R.tab,more=R.more,mode=R.log.mode;clearTimeout(later.t);later.t=setTimeout(()=>{if(R.tab===tab&&R.more===more&&R.log.mode===mode)render()},260)}
function onField(e,isChange){const el=e.target;
  if(el.id==='q'){R.q=el.value;$('#list').innerHTML=listHtml();return}
  if(el.id==='eSecs'){const v=num(el.value);if(v>0&&T.enl.state==='idle'){S.timer.secs=v;save();paintTimer()}return}
  if(el.dataset.f&&F){F.p[el.dataset.f]=el.value;
    if(el.dataset.g&&el.value!==''&&isChange){const g=gradeInfo(+el.value);F.p.y=String(g.y);F.p.m=String(g.m);$('[data-f=y]').value=g.y;$('[data-f=m]').value=g.m}
    if(el.dataset.r&&isChange)later();return}
  if(el.dataset.k){const k=el.dataset.k;setPath(S.calc,k,el.dataset.n?+el.value:el.value);
    if(el.dataset.fmt){const f=FORMATS[el.value];if(f){S.calc.resize.negLong=String(f[0]);S.calc.resize.negShort=String(f[1])}save();render();return}
    if(k==='resize.negLong'){const f=FORMATS[S.calc.resize.fmt];if(!f||num(el.value)!==f[0]){S.calc.resize.negShort=f?String(num(el.value)*f[1]/f[0]):el.value}}
    save();TOOLS[S.calc.tool].out();return}
  if(el.dataset.cal){const [k,q]=el.dataset.cal.split('.');const g=S.calib.g[k]=S.calib.g[k]||{y:'',m:'',f:''};g[q]=el.value.trim();if(!has(g.y)&&!has(g.m)&&!has(g.f))delete S.calib.g[k];save();if(isChange)later();return}
  if(el.dataset.s){let v=el.value;if(el.dataset.clock){v=parseClock(v);if(!(v>0))return}else if(el.dataset.n){v=v===''?'':num(v);if(v!==''&&!isFinite(v))return}
    setPath(S,el.dataset.s,v);save();if(isChange&&(el.dataset.r||el.dataset.clock))later();return}}
document.addEventListener('input',e=>onField(e,false));
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='camIn'||el.id==='libIn'){onPhotoFiles(el);return}
  if(el.id==='impIn'){const f=el.files[0];el.value='';if(f)importFile(f,R.imp||'merge');return}
  if(el.tagName!=='SELECT'&&!(el.dataset.r||el.dataset.clock||el.dataset.cal))return;
  onField(e,true)});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&R.tab==='timer'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();(R.timerTab==='proc'?procStart:enlStart)()}
  if(e.key==='Escape'&&!$('#lb').hidden)A.closeLb()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&anyRun())wake(true)});

/* ================= pwa bits ================= */
function pwa(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});if(location.protocol==='https:')return;const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');x.fillStyle='#0d0c0b';x.fillRect(0,0,192,192);x.strokeStyle='#f0a030';x.lineWidth=7;x.beginPath();x.arc(96,96,62,0,7);x.stroke();
  x.fillStyle='#f0a030';x.font='italic 600 84px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('D',96,100);const png=c.toDataURL('image/png');
  const add=(rel,href,type)=>{const l=document.createElement('link');l.rel=rel;l.href=href;if(type)l.type=type;document.head.appendChild(l)};
  add('apple-touch-icon',png);add('icon',png,'image/png');
  add('manifest','data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'Dmax darkroom notebook',short_name:'Dmax',display:'standalone',background_color:'#0d0c0b',theme_color:'#0d0c0b',icons:[{src:png,sizes:'192x192',type:'image/png'}]})))}catch(e){}}

/* ================= boot ================= */
(async function(){const ok=await DB.open();
  try{const s=await DB.get('kv','settings');if(s)S=mergeDef(DEF(),s);prints=(await DB.all('prints'))||[]}catch(e){}
  applySafe();pwa();render();
  if(!ok)toast('Database blocked here. Data will not persist.');
  window.__dmax={S:()=>S,prints:()=>prints,resizeMath,stripRows,gradeInfo,T};
})();
</script>
